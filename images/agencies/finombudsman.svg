    <path d="M38 38 L33 48 H43 L38 38 Z" fill="#D0A144"/>
    <path d="M33 50 C33 53 35.2 55 38 55 C40.8 55 43 53 43 50 Z" fill="#D0A144"/>
    
    <!-- Right Pan -->
