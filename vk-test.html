<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>VK ID Test</title>
  <script src="/js/vkid-sdk.js"></script>
</head>
<body style="background:#111; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif;">
  <div style="background:#222; padding:30px; border-radius:12px; text-align:center; max-width:600px; width:100%;">
    <h2>Тест авторизации VK ID</h2>
    <div id="VkIdSdkOneTap" style="margin:20px auto; min-height:44px; display:flex; justify-content:center;"></div>
    <div id="result" style="margin-top:20px; font-weight:bold;"></div>
    <pre id="logs" style="text-align:left; background:#111; padding:15px; border-radius:8px; font-size:12px; color:#aaa; margin-top:20px; max-height:200px; overflow:auto;"></pre>
  </div>

  <script type="text/javascript">
    function log(msg) {
      console.log(msg);
      const el = document.getElementById('logs');
      if (el) el.innerText += msg + '\n';
    }

    log('1. Page loaded. Checking VKIDSDK...');
    window.addEventListener('load', function() {
      log('2. Window load event fired.');
      if (typeof window.VKIDSDK === 'undefined') {
        log('❌ ОШИБКА: window.VKIDSDK не найден (скрипт vkid-sdk.js не загрузился или заблокирован расширением браузера).');
        document.getElementById('result').innerText = '❌ SDK заблокирован браузером';
        document.getElementById('result').style.color = '#ef4444';
        return;
      }
      log('✅ window.VKIDSDK обнаружен.');
      const VKID = window.VKIDSDK;

      try {
        log('3. Инициализация VKID.Config.init(app: 54739846)...');
        VKID.Config.init({
          app: 54739846,
          redirectUrl: 'https://yugpravo.ru/assignment-viewer.html'
        });
        log('✅ VKID.Config.init выполнен успешно.');

        const container = document.getElementById('VkIdSdkOneTap');
        log('4. Монтирование OneTap в контейнер...');
        const oneTap = new VKID.OneTap();
        oneTap.render({
          container: container,
          showAlternativeLogin: true,
          styles: { width: 240 }
        })
        .on(VKID.WidgetEvents.ERROR, function(err) {
          log('❌ Ошибка виджета VKID: ' + JSON.stringify(err));
          document.getElementById('result').innerText = 'Ошибка виджета: ' + JSON.stringify(err);
          document.getElementById('result').style.color = '#ef4444';
        })
        .on(VKID.OneTapInternalEvents.LOGIN_SUCCESS, function(payload) {
          log('🎉 УСПЕХ АВТОРИЗАЦИИ! Code: ' + payload.code);
          document.getElementById('result').innerText = 'Успех! Code: ' + payload.code;
          document.getElementById('result').style.color = '#22c55e';
        });
        log('5. oneTap.render() вызван.');
      } catch(e) {
        log('❌ Исключение: ' + e.message + '\n' + e.stack);
      }
    });
  </script>
</body>
</html>
